apply plugin: "com.android.application"

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace "com.tinymobileapp"

    defaultConfig {
        applicationId "com.tinymobileapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', "$buildDir/generated/assets/react/release"]
            res.srcDirs = ['src/main/res', "$buildDir/generated/res/react/release"]
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation "com.facebook.react:react-android:0.73.2"
    implementation "com.facebook.react:hermes-android:0.73.2"

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}

// Autolinking for native modules
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

// Task to bundle JavaScript and assets for release builds
task bundleReleaseJsAndAssets(type: Exec) {
    description = "Bundle React Native JS and assets for release"

    def jsBundleDir = "$buildDir/generated/assets/react/release"
    def resourcesDir = "$buildDir/generated/res/react/release"
    def jsBundleFile = "$jsBundleDir/index.android.bundle"

    doFirst {
        // Create directories
        file(jsBundleDir).mkdirs()
        file(resourcesDir).mkdirs()
    }

    workingDir rootProject.projectDir.parent

    commandLine "npx", "react-native", "bundle",
        "--platform", "android",
        "--dev", "false",
        "--entry-file", "index.js",
        "--bundle-output", jsBundleFile,
        "--assets-dest", resourcesDir
}

// Make sure the bundle task runs before merging assets
tasks.whenTaskAdded { task ->
    if (task.name == 'mergeReleaseAssets') {
        task.dependsOn bundleReleaseJsAndAssets
    }
}
