name: Build Android APK

on:
  push:
    branches:
      - 'claude/mobile-platformer-apk-**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write  # Needed to commit APK and create releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          cd android/app/build/outputs/apk/release
          if [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk app-release.apk
          fi

      - name: Get version info
        id: version_info
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Copy APK to releases folder
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/release/app-release.apk \
             releases/tiny-platformer-v${{ steps.version_info.outputs.version }}-build${{ github.run_number }}.apk
          ls -lh releases/

      - name: Commit APK to repository
        if: startsWith(github.ref, 'refs/heads/claude/mobile-platformer-apk-')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add releases/*.apk
          git commit -m "🤖 Auto-build: Add APK v${{ steps.version_info.outputs.version }} build #${{ github.run_number }}" || echo "No changes to commit"
          git push || echo "Push failed, possibly no changes"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-platformer-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            releases/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/mobile-platformer-apk-')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version_info.outputs.version }}-${{ github.run_number }}
          name: Tiny Platformer v${{ steps.version_info.outputs.version }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## 🎮 Tiny Platformer - Android APK

            **Version:** ${{ steps.version_info.outputs.version }}
            **Build:** ${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            **Timestamp:** ${{ steps.version_info.outputs.timestamp }}

            ### 📥 Installation
            1. Téléchargez le fichier `app-release.apk`
            2. Transférez-le sur votre appareil Android
            3. Activez "Sources inconnues" dans les paramètres si nécessaire
            4. Installez l'APK

            ### 🎯 Fonctionnalités
            - Contrôles tactiles gauche/droite
            - Génération infinie de plateformes
            - Physique réaliste avec gravité
            - Système de score et high score
            - Game over et restart

            ### 🎮 Comment jouer
            - Bouton gauche (←) : Déplacer vers la gauche
            - Bouton droite (→) : Déplacer vers la droite
            - Montez le plus haut possible !
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
